<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NuverxAI - AI Contract</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/shared.css"/>
  <link rel="stylesheet" href="css/landing.css"/>
  <link rel="stylesheet" href="css/upload.css"/>
  <link rel="stylesheet" href="css/extract.css"/>
  <link rel="stylesheet" href="css/chatbot.css"/>
  <link rel="stylesheet" href="css/contracts.css"/>
</head>
<body>

  <div id="app"></div>

  <!-- JS load trước, theo đúng thứ tự phụ thuộc -->
  <!-- PDF.js để render thumbnail -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <script src="js/nav.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/extract.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/contracts.js"></script>

  <script>
    const PAGES = [
      'pages/landing.html',
      'pages/modal.html',
      'pages/upload.html',
      'pages/extract.html',
      'pages/chatbot.html',
      'pages/notif.html',
      'pages/avatar_popup.html',
    ];

    const CONTRACT_PAGES = [
      'pages/contracts_list.html',
      'pages/contracts_detail.html',
    ];

    async function loadPages() {
      const app = document.getElementById('app');

      // Load các màn hình thông thường
      for (const url of PAGES) {
        const res  = await fetch(url);
        const html = await res.text();
        app.insertAdjacentHTML('beforeend', html);
      }

      // Load màn hợp đồng — bọc trong #page-contracts để .page system hoạt động đúng
      const contractsWrapper = document.createElement('div');
      contractsWrapper.id = 'page-contracts';
      contractsWrapper.className = 'page';
      for (const url of CONTRACT_PAGES) {
        const res  = await fetch(url);
        const html = await res.text();
        contractsWrapper.insertAdjacentHTML('beforeend', html);
      }
      app.appendChild(contractsWrapper);
    }

    loadPages().then(() => {
      injectSharedAvatarPopup();
    }).catch(err => {
      console.error('Lỗi load page:', err);
      document.getElementById('app').innerHTML =
        '<div style="padding:40px;text-align:center;color:#E65134;font-size:16px;">' +
        '⚠️ Vui lòng chạy qua XAMPP hoặc Live Server để load đúng cấu trúc đa file.' +
        '</div>';
    });
  </script>

</body>
</html>
