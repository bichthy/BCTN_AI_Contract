<!--
  avatar-popup.html — Avatar popup menu (component dùng chung)
-->
<div id="avatar-popup-shared" class="avatar-popup">
  <div class="avatar-popup-user">
    <div class="avatar-popup-img">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </div>
    <div>
      <div class="avatar-popup-name">Nguyễn Bích Thy</div>
      <div class="avatar-popup-email">bichthy@nuverxai.com</div>
    </div>
  </div>
  <div class="avatar-popup-divider"></div>
  <div class="avatar-popup-menu">
    <div class="avatar-popup-item">
      <div class="avatar-popup-item-left">
        <div class="avatar-popup-item-icon" style="background:#FFF0EC;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E65134" stroke-width="2">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <span class="avatar-popup-item-text">Thông tin cá nhân</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <div class="avatar-popup-item" onclick="goToMyContracts()">
      <div class="avatar-popup-item-left">
        <div class="avatar-popup-item-icon" style="background:#FFF0EC;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E65134" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
        </div>
        <span class="avatar-popup-item-text">Hợp đồng của tôi</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>
  <div class="avatar-popup-divider"></div>
  <div class="avatar-popup-logout" onclick="openLogoutConfirm()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#E65134" stroke-width="2">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    Đăng xuất
  </div>
</div>

<!-- MODAL: XÁC NHẬN ĐĂNG XUẤT -->
<div id="modal-logout-confirm"
     onclick="if(event.target===this)closeLogoutConfirm()"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:10000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:24px;padding:40px 36px 32px;width:420px;max-width:94vw;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.22);animation:logoutIn .25s cubic-bezier(.34,1.56,.64,1);">
    <style>@keyframes logoutIn{from{opacity:0;transform:scale(.88) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}</style>
    <div style="width:64px;height:64px;border-radius:50%;background:#FFF0EC;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E65134" stroke-width="2.2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </div>
    <div style="font-size:20px;font-weight:700;color:#111;margin-bottom:10px;">Xác nhận đăng xuất</div>
    <div style="font-size:14px;color:#6B7280;line-height:1.65;margin-bottom:28px;">Bạn có chắc chắn muốn đăng xuất khỏi hệ thống không?</div>
    <div style="display:flex;gap:12px;">
      <button onclick="closeLogoutConfirm()"
              style="flex:1;padding:13px;border:1.5px solid #E5E7EB;border-radius:14px;background:#F9FAFB;color:#6B7280;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;">
        Hủy bỏ
      </button>
      <button onclick="doLogout()"
              style="flex:1;padding:13px;border:none;border-radius:14px;background:#E65134;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(230,81,52,.3);">
        Đăng xuất
      </button>
    </div>
  </div>
</div>
