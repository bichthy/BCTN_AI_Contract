<!--
  modal.html — Login Modal
-->

<div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <div class="modal-logo">
      <div class="modal-logo-img">
        <img src="https://storage.googleapis.com/tagjs-prod.appspot.com/v1/pPPhvHlewN/cb6uohth_expires_30_days.png"
          style="width:100%;height:100%;object-fit:contain;" onerror="this.style.display='none'"/>
      </div>
      <div>
        <div class="modal-logo-name">NuverxAI</div>
        <div class="modal-logo-sub">AI CONTRACT</div>
      </div>
    </div>
    <div class="modal-title">Đăng nhập hệ thống</div>
    <div class="modal-sub">Nhập thông tin tài khoản để tiếp tục sử dụng dịch vụ</div>

    <div class="form-group">
      <label class="form-label"><span>*</span>Email</label>
      <div class="input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/>
        </svg>
        <input type="email" id="login-email" placeholder="example@nuverxai.com"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label"><span>*</span>Mật khẩu</label>
      <div class="input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="login-pw" placeholder="••••••••••••"/>
        <span class="pw-toggle" id="pw-eye" onclick="togglePw()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </span>
      </div>
      <div class="forgot">Quên mật khẩu?</div>
    </div>

    <button class="btn-login" onclick="doLogin()">Đăng nhập</button>
  </div>
</div>
